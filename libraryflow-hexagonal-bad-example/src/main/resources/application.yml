server:
  port: 8081

spring:
  application:
    name: libraryflow-hexagonal-red
  datasource:
    url: jdbc:h2:mem:libraryflow-red
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        hbm2ddl.create_namespaces: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  graphql:
    graphiql:
      enabled: true
